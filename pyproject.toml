[project]
name = "gmail-inbox-bot"
version = "0.1.0"
description = "Email automation bot built on Gmail API"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "google-api-python-client>=2.199.0",
    "google-auth>=2.57.0",
    "google-auth-oauthlib>=1.4.1",
    "httpx2>=2.12.0",
    "jinja2>=3.1.6",
    "neutral-llm-gateway[groq,openai]==0.14.1",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "uvicorn>=0.52.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gmail_inbox_bot"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]
