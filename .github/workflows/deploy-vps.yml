name: Deploy Gmail Inbox Bot
on:
  push:
    branches: [main]
    # Un commit de solo tests o docs no cambia la imagen: no redesplegar.
    paths-ignore:
      - 'tests/**'
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

concurrency:
  group: deploy-gmail-vps
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v7

      # Los mismos checks que el CI y el pre-push (lock verificado, formato, hooks): con
      # unos más laxos aquí, un push que rompe el CI se desplegaba igual.
      - name: Shared local and CI checks
        run: bash scripts/ci-local.sh

  build-image:
    name: Build immutable image (GHCR)
    needs: quality
    runs-on: ubuntu-latest
    outputs:
      image_ref: ${{ steps.digest.outputs.image_ref }}
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - uses: actions/checkout@v6

      - name: Resolve image coordinates
        id: meta
        run: |
          OWNER_LOWER="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/${OWNER_LOWER}/gmail-inbox-bot"
          IMAGE_TAG="${IMAGE}:sha-${GITHUB_SHA}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:main
            ${{ steps.meta.outputs.image_tag }}

      - id: digest
        run: |
          echo "image_ref=${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

      # GHCR no borra nada nunca: llegó a 60 versiones antes de la primera purga
      # (2026-07-17). Cada build sube 3 versiones (la imagen + los artefactos de
      # buildx), así que 12 ≈ 4 builds de margen para rollback. Corre DESPUÉS del
      # push, por lo que la imagen recién construida es la más reciente y nunca se
      # toca; `main` apunta a ella y es lo que el VPS pulea por digest. Este repo
      # despliega en CADA push a main (sin gate VPS_AUTO_DEPLOY_ENABLED), así que
      # sin esto el registro crece sin techo.
      # Poda manual equivalente: presupuestor/scripts/purge-ghcr-versions.sh
      - name: Purga versiones antiguas en GHCR
        uses: actions/delete-package-versions@v5
        continue-on-error: true
        with:
          package-name: gmail-inbox-bot
          package-type: container
          min-versions-to-keep: 12

  deploy:
    needs: build-image
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ubuntu
          key: ${{ secrets.VPS_SSH_KEY }}
          # Espera del lock (hasta 5 min) + pull + healthcheck (~1,5 min) + rollback si falla.
          command_timeout: 10m
          script: |
            set -euo pipefail
            cd /home/ubuntu/services/gmail-inbox-bot
            # El SHA exacto de la imagen, no el main del momento: con dos pushes seguidos,
            # config/ (montado desde aquí) podía ir por delante del código de la imagen.
            DEPLOY_PREVIOUS_SHA="$(git rev-parse HEAD)"
            git fetch origin main
            git merge --ff-only '${{ github.sha }}'
            # Un run retrasado o relanzado de un commit anterior al checkout (p. ej. tras un
            # deploy a mano) haría "Already up to date" e instalaría la imagen vieja con la
            # config/ nueva. Se omite.
            if [ "$(git rev-parse HEAD)" != '${{ github.sha }}' ]; then
              echo "Checkout en $(git rev-parse --short HEAD), por delante de ${{ github.sha }}: deploy obsoleto, se omite"
              exit 0
            fi

            DEPLOY_PREVIOUS_SHA="$DEPLOY_PREVIOUS_SHA" \
            DEPLOY_IMAGE_REF='${{ needs.build-image.outputs.image_ref }}' \
            DEPLOY_ALLOW_FALLBACK='true' \
            GHCR_USERNAME='${{ secrets.GHCR_USERNAME }}' \
            GHCR_TOKEN='${{ secrets.GHCR_TOKEN }}' \
            ./scripts/vps_deploy.sh

  notify-failure:
    needs: [quality, build-image, deploy]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      # Si el contenedor nuevo no llega a arrancar, el Telegram del bot nunca se inicializa:
      # este es el único aviso fuera del email de GitHub.
      - name: Aviso por Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sf --max-time 20 "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=❌ [Gmail Bot] Deploy fallido (${GITHUB_SHA::7}). ${RUN_URL}"
