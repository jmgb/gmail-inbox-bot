name: Deploy Gmail Inbox Bot
on:
  push:
    branches: [main]
    # Un commit de solo tests o docs no cambia la imagen: no redesplegar.
    paths-ignore:
      - 'tests/**'
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

concurrency:
  group: deploy-gmail-vps
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v7

      # Los mismos checks que el CI y el pre-push (lock verificado, formato, hooks): con
      # unos más laxos aquí, un push que rompe el CI se desplegaba igual.
      - name: Shared local and CI checks
        run: bash scripts/ci-local.sh

  build-image:
    permissions:
      contents: read
      packages: write
    name: Build immutable image (GHCR)
    needs: quality
    runs-on: ubuntu-latest
    outputs:
      image_ref: ${{ steps.digest.outputs.image_ref }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image_digest: ${{ steps.build.outputs.digest }}

    steps:
      - uses: actions/checkout@v6

      - name: Resolve image coordinates
        id: meta
        run: |
          OWNER_LOWER="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/${OWNER_LOWER}/gmail-inbox-bot"
          IMAGE_TAG="${IMAGE}:sha-${GITHUB_SHA}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:main
            ${{ steps.meta.outputs.image_tag }}

      - id: digest
        run: |
          echo "image_ref=${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

      # GHCR no borra nada nunca: llegó a 60 versiones antes de la primera purga
      # (2026-07-17). Cada build sube 3 versiones (la imagen + los artefactos de
      # buildx), así que 12 ≈ 4 builds de margen para rollback. Corre DESPUÉS del
      # push. La aprobación externa usa un digest exacto; la poda puede retirar
      # candidatos antiguos aún no aprobados. Una descarga fallida aborta antes
      # de cambiar producción; no se vuelve a construir automáticamente en el VPS.
      # Poda manual equivalente: presupuestor/scripts/purge-ghcr-versions.sh
      - name: Purga versiones antiguas en GHCR
        uses: actions/delete-package-versions@v5
        continue-on-error: true
        with:
          package-name: gmail-inbox-bot
          package-type: container
          min-versions-to-keep: 12

  # CI can submit only hash data. Approval and activation happen outside GitHub.
  request-promotion:
    needs: build-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Request administrator promotion
        env:
          REQUEST_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_SSH_HOST_KEY: ${{ vars.VPS_SSH_HOST_KEY }}
          IMAGE_DIGEST: ${{ needs.build-image.outputs.image_digest }}
        run: |
          set -euo pipefail
          [[ "$VPS_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$VPS_SSH_HOST_KEY" =~ ^ssh-ed25519[[:space:]][A-Za-z0-9+/=]+$ ]]
          umask 077
          request_dir="$(mktemp -d)"
          trap 'rm -rf -- "$request_dir"' EXIT
          printf '%s\n' "$REQUEST_SSH_KEY" > "$request_dir/key"
          unset REQUEST_SSH_KEY
          printf '%s %s\n' "$VPS_HOST" "$VPS_SSH_HOST_KEY" > "$request_dir/known_hosts"
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$request_dir/known_hosts" \
            -o PasswordAuthentication=no -o KbdInteractiveAuthentication=no \
            -o ForwardAgent=no -o ClearAllForwardings=yes \
            -i "$request_dir/key" -- "deploy-gmail@$VPS_HOST" \
            "request $GITHUB_SHA $IMAGE_DIGEST"
